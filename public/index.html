<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEBUGGING Symposium</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070b14;color:#eef3ff}header{padding:18px 28px;border-bottom:1px solid #26324b;display:flex;justify-content:space-between;background:#0b1120;position:sticky;top:0;z-index:3}b{color:#63e6ff}.wrap{max-width:1100px;margin:35px auto;padding:15px}.card{background:#0e1627;border:1px solid #263552;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 10px 35px #0005}.center{max-width:520px;margin:70px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{padding:18px;background:#101b30;border:1px solid #293a5b;border-radius:12px}.stat b{display:block;font-size:28px;margin-top:8px}input,textarea,select{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #344463;background:#080e1b;color:white}button{padding:12px 17px;border:0;border-radius:9px;background:#16c9ef;color:#031018;font-weight:700;cursor:pointer;margin:5px}button.secondary{background:#293a55;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.person{padding:14px;border-bottom:1px solid #26324b;display:flex;justify-content:space-between;gap:10px;align-items:center}.option{display:block;width:100%;text-align:left;background:#15223a;color:white;border:1px solid #334767}.option.selected{outline:2px solid #16c9ef}.timer{font-size:24px;color:#ffcc66}.quiztop{display:flex;justify-content:space-between;max-width:900px;margin:auto;padding:20px}.q{font-size:21px;line-height:1.5}.tag{display:inline-block;padding:8px 12px;border-radius:20px;background:#17394b;color:#6fe8ff}.danger{color:#ff6b7d}.small{opacity:.75;font-size:13px}a{color:#63e6ff;display:block;margin:12px 0}.hide{display:none}</style></head><body><div id="app"></div><script>
const A='/api',app=document.getElementById('app');let timer=null;
async function api(p,o={}){const r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(localStorage.t?{Authorization:'Bearer '+localStorage.t}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
function header(x='DEBUGGING'){return `<header><b>⚡ ${x}</b><span>TECHNICAL SYMPOSIUM</span></header>`}function card(x){return `<div class="card">${x}</div>`}
function login(admin=false){app.innerHTML=header()+'<div class="center">'+card(`<h1>${admin?'Admin Login':'Participant Login'}</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="doLogin(${admin})">LOGIN</button><a href="/register" onclick="event.preventDefault();register()">Register team</a><p id="m"></p>`+'</div>')}
function register(){app.innerHTML=header()+'<div class="center">'+card(`<h1>Team Registration</h1><input id="u" placeholder="Username"><input id="t" placeholder="Team Name"><input id="p" type="password" placeholder="Password"><input id="c" type="password" placeholder="Confirm Password"><button onclick="doReg()">REGISTER</button><a href="/" onclick="event.preventDefault();login()">Back to login</a><p id="m"></p>`+'</div>')}
async function doReg(){try{if(p.value!==c.value)throw Error('Passwords do not match');await api('/auth/register',{method:'POST',body:JSON.stringify({username:u.value,teamName:t.value,password:p.value})});m.textContent='Registered! You can login now.'}catch(e){m.textContent=e.message}}
async function doLogin(ad){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});if(ad&&d.user.role!=='admin')throw Error('Admin only');localStorage.t=d.token;ad?admin():participant()}catch(e){m.textContent=e.message}}
async function participant(){const me=await api('/auth/me');app.innerHTML=header()+`<div class="wrap"><div class="card"><span class="tag">${me.user.teamName}</span><h1>Welcome, ${me.user.username}</h1><h2>WAITING ROOM</h2><p id="s">Checking round status...</p><button class="secondary" onclick="logout()">LOGOUT</button></div></div>`;checkStatus()}
async function checkStatus(){try{const s=await api('/rounds/status');const el=document.getElementById('s');if(s.round1.status==='ACTIVE'){quiz(1);return}if(s.round2.qualification==='SELECTED'&&s.round2.status==='ACTIVE'){quiz(2);return}el.innerHTML=s.round2.qualification==='SELECTED'?'<b>SELECTED FOR ROUND 2</b><br>Wait for admin to start Round 2.':'Waiting for admin to start Round 1.'}catch(e){logout()}setTimeout(checkStatus,2000)}
async function quiz(n){clearInterval(timer);let started,qs,ans={},idx=0;try{started=await api('/rounds/'+n+'/start',{method:'POST'});qs=(await api('/rounds/'+n+'/questions')).questions}catch(e){return alert(e.message)}let left=started.durationSeconds;const esc=x=>String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const render=()=>{const q=qs[idx];const isDebug=n===2;const saved=ans[q.id]||'';const content=isDebug?`<pre style="background:#050a12;border:1px solid #334767;border-radius:10px;padding:16px;overflow:auto;max-height:520px;text-align:left;font-size:14px;line-height:1.5;color:#dce8ff"><code>${esc(q.code)}</code></pre><p class="small">Edit the code below and submit your corrected version. Your fix is evaluated automatically.</p><textarea id="codeAnswer" rows="18" style="font-family:Consolas,monospace;font-size:13px" placeholder="Paste the corrected Python code here...">${esc(saved)}</textarea>`:`<div class="q">${esc(q.question_text)}</div>${['A','B','C','D'].map(k=>`<button class="option ${ans[q.id]===k?'selected':''}" onclick="pick('${k}')">${k}. ${esc(q['option_'+k.toLowerCase()])}</button>`).join('')}`;app.innerHTML=header()+`<div class="quiztop"><b>ROUND ${n} — ${isDebug?'DEBUG THE CODE':'ADVANCED PYTHON'}</b><span class="timer" id="tm">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span></div><div class="wrap">${card(`<p>Question ${idx+1} of ${qs.length}</p><div class="q">${esc(q.question_text)}</div>${content}<div class="row"><button onclick="prev()" ${idx?'':'disabled'}>PREVIOUS</button>${idx<qs.length-1?'<button onclick="next()">NEXT</button>':'<button onclick="submitRound()">SUBMIT ROUND</button>'}</div>`)}</div>`};window.pick=async k=>{ans[qs[idx].id]=k;render();await api('/attempts/'+started.attemptId+'/answer',{method:'POST',body:JSON.stringify({questionId:qs[idx].id,selectedOption:k})})};window.saveDebug=async()=>{const v=document.getElementById('codeAnswer')?.value||'';ans[qs[idx].id]=v;await api('/attempts/'+started.attemptId+'/answer',{method:'POST',body:JSON.stringify({questionId:qs[idx].id,answerText:v})})};window.next=async()=>{if(n===2)await saveDebug();idx++;render()};window.prev=async()=>{if(n===2)await saveDebug();idx--;render()};window.submitRound=async()=>{if(n===2)await saveDebug();clearInterval(timer);const d=await api('/attempts/'+started.attemptId+'/submit',{method:'POST'});alert('Round '+n+' completed! Score: '+d.score+'/'+qs.length);participant()};render();timer=setInterval(()=>{left--;const el=document.getElementById('tm');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)submitRound()},1000)}
async function admin(){app.innerHTML=header('DEBUGGING — ADMIN')+'<div class="wrap"><h1>Competition Control</h1><div id="dash"></div>'+card('<h2>Round Control</h2><div class="row"><button onclick="startR(1)">START ROUND 1</button><button onclick="endR(1)">END ROUND 1</button><button onclick="startR(2)">START ROUND 2</button><button onclick="endR(2)">END ROUND 2</button></div>')+card('<h2>Participants</h2><div id="people"></div><button onclick="selectR2()">CONFIRM SELECTED FOR ROUND 2</button>')+card('<h2>Question Bank</h2><p class="small">Round 1 automatically uses questions 1–15. Round 2 uses questions 16–20. You can add more questions below.</p><div id="qs"></div><h3>Add Question</h3><input id="qt" placeholder="Question"><input id="qa" placeholder="Option A"><input id="qb" placeholder="Option B"><input id="qc" placeholder="Option C"><input id="qd" placeholder="Option D"><select id="qans"><option>A</option><option>B</option><option>C</option><option>D</option></select><button onclick="addQ()">ADD QUESTION</button></div>')+card('<h2>Rankings</h2><button onclick="rank(1)">ROUND 1</button><button onclick="rank(2)">ROUND 2</button><div id="rank"></div>');loadAdmin();setInterval(loadAdmin,3000)}
let chosen=new Set();async function loadAdmin(){const d=await api('/admin/dashboard');dash.innerHTML='<div class="stats">'+Object.entries(d).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')+'</div>';const ps=await api('/admin/participants');people.innerHTML=ps.map(p=>`<div class="person"><span><b>${p.username}</b> · ${p.team_name} · ${p.status} · R1: ${p.r1_score??'-'} · R2: ${p.r2_score??'-'}</span><span><button onclick="toggle(${p.id})">${chosen.has(p.id)?'SELECTED':'SELECT R2'}</button><button onclick="act(${p.id},'disqualify')">DQ</button><button onclick="act(${p.id},'allow')">ALLOW</button></span></div>`).join('');const qs=await api('/admin/questions');document.getElementById('qs').innerHTML=qs.map(q=>`<div class="person"><span>#${q.id} ${q.text}</span><button onclick="delQ(${q.id})">DELETE</button></div>`).join('')}
function toggle(id){chosen.has(id)?chosen.delete(id):chosen.add(id);loadAdmin()}async function selectR2(){await api('/admin/select-round2',{method:'POST',body:JSON.stringify({userIds:[...chosen]})});alert('Round 2 selection saved')}async function startR(n){try{await api('/admin/rounds/'+n+'/start',{method:'POST'});alert('Round '+n+' started')}catch(e){alert(e.message)}}async function endR(n){await api('/admin/rounds/'+n+'/end',{method:'POST'})}async function act(id,a){await api('/admin/participants/'+id+'/'+a,{method:'POST'});loadAdmin()}async function addQ(){try{await api('/admin/questions',{method:'POST',body:JSON.stringify({text:qt.value,a:qa.value,b:qb.value,c:qc.value,d:qd.value,answer:qans.value})});qt.value=qa.value=qb.value=qc.value=qd.value='';loadAdmin()}catch(e){alert(e.message)}}async function delQ(id){await api('/admin/questions/'+id,{method:'DELETE'});loadAdmin()}async function rank(n){const r=await api('/admin/rankings/'+n);document.getElementById('rank').innerHTML=r.map((x,i)=>`<p>${i+1}. <b>${x.team_name}</b> — ${x.score} points — ${x.time_taken}s</p>`).join('')||'<p>No completed attempts.</p>'}function logout(){localStorage.clear();login()}
const path=location.pathname;if(path==='/register')register();else if(path==='/admin/login')login(true);else if(localStorage.t){api('/auth/me').then(x=>x.user.role==='admin'?admin():participant()).catch(()=>login())}else login();
</script></body></html>
